<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب | مُجدد</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { darkMode: 'class' }
</script>
</head>

<body class="min-h-screen bg-white dark:bg-gray-950 flex items-center justify-center transition duration-300">

<div class="w-full max-w-md px-8 py-10 bg-white dark:bg-gray-900 shadow-xl rounded-2xl border border-gray-100 dark:border-gray-800">

    <!-- Logo -->
    <div class="text-center mb-8">
        <h1 class="text-2xl font-bold bg-gradient-to-r from-purple-600 to-indigo-600 bg-clip-text text-transparent">
            مُجدد
        </h1>
        <p class="text-sm text-gray-500 dark:text-gray-400 mt-2">
            أنشئ حسابك وابدأ إدارة اشتراكاتك
        </p>
    </div>

    {% if messages %}
    <div class="mb-4 space-y-2">
        {% for message in messages %}
        <div class="text-red-500 text-sm">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}

    <!-- Form -->
    <form method="post" class="space-y-5">
        {% csrf_token %}

        <!-- Organization Name -->
        <div>
            <label class="block mb-2 text-sm font-medium">اسم المنشأة</label>
            <input type="text" name="org_name"
                value="{{ org_name|default:'' }}"
                placeholder="مثال: شركة النور للتقنية"
                class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-purple-500 transition"
                required>
        </div>

        <!-- Username -->
        <div>
            <label class="block mb-2 text-sm font-medium">اسم المستخدم</label>
            <input type="text" name="username"
                value="{{ username|default:'' }}"
                class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-purple-500 transition"
                required>
        </div>

        <!-- Email -->
        <div>
            <label class="block mb-2 text-sm font-medium">البريد الإلكتروني</label>
            <input type="email" name="email"
                value="{{ email|default:'' }}"
                class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-purple-500 transition"
                required>
        </div>

        <!-- Password -->
        <div>
            <label class="block mb-2 text-sm font-medium">كلمة المرور</label>
            <input type="password" name="password"
                class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-purple-500 transition"
                required>
        </div>

        <!-- Confirm Password -->
        <div>
            <label class="block mb-2 text-sm font-medium">تأكيد كلمة المرور</label>
            <input type="password" name="password2"
                class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-purple-500 transition"
                required>
        </div>

        <button type="submit"
            class="w-full py-3 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-semibold shadow-lg hover:scale-[1.02] transition">
            إنشاء الحساب
        </button>

    </form>

    <!-- Login Link -->
    <p class="text-center text-sm text-gray-500 dark:text-gray-400 mt-6">
        لديك حساب بالفعل؟
        <a href="{% url 'login' %}" class="text-purple-600 hover:underline font-medium">تسجيل الدخول</a>
    </p>

</div>

</body>
</html>
