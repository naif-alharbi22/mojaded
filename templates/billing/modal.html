{% load i18n %}
{% load static %}

<dialog id="modal" class="modal modal-open">
  <form
    method="post"
    hx-post=""
    hx-target="#modal"
    hx-swap="innerHTML"
    class="modal-box max-w-3xl p-0 overflow-hidden rounded-2xl"
  >
    {% csrf_token %}

    <!-- Header -->
    <div class="px-6 py-4 border-b border-gray-200 flex items-center justify-between bg-white">
      <h3 class="text-lg font-bold bg-gradient-to-r from-purple-600 to-indigo-600 bg-clip-text text-transparent">
        {% translate "New Invoice" %}
      </h3>

      <button type="button" onclick="closeModal(this)">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
    </div>

    <!-- Body -->
    <div class="p-6 space-y-5 bg-gray-50">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

        <!-- Invoice Type -->
        <div class="form-control md:col-span-2">
          <label class="label">
            <span class="label-text">نوع الفاتورة</span>
          </label>

          <div class="flex flex-wrap gap-6 mt-2">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="invoice_type" value="subscription" class="radio radio-primary" checked>
              <span>اشتراك</span>
            </label>

            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="invoice_type" value="manual" class="radio radio-primary">
              <span>يدوية</span>
            </label>

            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="invoice_type" value="adjustment" class="radio radio-primary">
              <span>تعديل</span>
            </label>
          </div>
        </div>

        <!-- Subscription (if needed) -->
        <div class="form-control md:col-span-2">
          <label class="label">
            <span class="label-text">الاشتراك</span>
          </label>
          
          <select name="subscription_id" class="select select-bordered w-full">
            {% for s in subscriptions %}
              <option value="{{ s.id }}">#{{ s.id }} - {{ s.customer.name }} - {{ s.plan.name }}</option>
            {% endfor %}
          </select>
          
        </div>

        <!-- Issue Date -->
        <div class="form-control">
          <label class="label">
            <span class="label-text">تاريخ الإصدار</span>
          </label>
          <input
            type="date"
            name="issue_date"
            value="{{ today }}"
            class="input input-bordered w-full"
          />
        </div>

        <!-- Due Date -->
        <div class="form-control">
          <label class="label">
            <span class="label-text">تاريخ الاستحقاق</span>
          </label>
          <input
            type="date"
            name="due_date"
            value="{{ today }}"
            class="input input-bordered w-full"
            required
          />
        </div>

        <!-- Amount -->
        <div class="form-control md:col-span-2">
          <label class="label">
            <span class="label-text">المبلغ</span>
          </label>
          <input
            type="number"
            step="0.01"
            name="amount"
            class="input input-bordered w-full text-left"
            placeholder="0.00"
            required
          />
          <label class="label">
            <span class="label-text-alt text-gray-400">يفضل تركه يتعبّى تلقائيًا من الاشتراك (إذا كان النوع اشتراك).</span>
          </label>
        </div>

        <!-- Status -->
        <div class="form-control md:col-span-2">
          <label class="label">
            <span class="label-text">حالة الفاتورة</span>
          </label>

          <select name="status" class="select select-bordered w-full">
            <option value="pending" selected>بانتظار الدفع</option>
            <option value="paid">مدفوعة</option>
            <option value="overdue">متأخرة</option>
            <option value="cancelled">ملغاة</option>
          </select>
        </div>

      </div>
    </div>

    <!-- Footer -->
    <div class="px-6 py-4 border-t border-gray-200 bg-white flex justify-end gap-3">
     
      <button
        type="submit"
        class="btn bg-gradient-to-r from-purple-600 to-indigo-600 text-white border-none hover:opacity-90"
      >
        {% translate "Create" %}
      </button>
    </div>

  </form>
</dialog>
