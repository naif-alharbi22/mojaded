<dialog id="modal" class="modal modal-open">

<form
    method="post"
    hx-post="{% if invoice %}{% url 'billing:edit_invoice' invoice.id %}{% else %}{% url 'billing:new_invoices' %}{% endif %}"
    hx-target="#modal"
    hx-swap="innerHTML"
    class="modal-box max-w-3xl p-0 overflow-hidden rounded-2xl bg-dark2 border border-g/20 shadow-2xl">

    {% csrf_token %}

    <!-- Header -->
    <div class="px-6 py-4 border-b border-g/10 flex items-center justify-between bg-dark3">
        <h3 class="text-base font-bold px-4 py-1.5 rounded-lg bg-[#00c98d]/10 text-[#00c98d] border border-[#00c98d]/20">
            {% if invoice %}تعديل الفاتورة{% else %}إضافة فاتورة جديدة{% endif %}
        </h3>
        <button type="button" onclick="closeModal(this)">
            <i data-lucide="x" class="w-4 h-4"></i>
        </button>
    </div>

    <!-- Body -->
    <div class="p-6 space-y-5 bg-dark">

        {% if form.non_field_errors %}
        <div class="alert alert-error text-sm">
            {{ form.non_field_errors }}
        </div>
        {% endif %}

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

            <!-- Invoice Type -->
            <div class="form-control md:col-span-2">
                <label class="label">
                    <span class="label-text">نوع الفاتورة</span>
                </label>
                <div class="flex flex-wrap gap-6 mt-2">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="invoice_type" value="subscription" class="radio radio-primary"
                            {% if form.invoice_type.value == "subscription" or not form.invoice_type.value %}checked{% endif %}>
                        <span>اشتراك</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="invoice_type" value="manual" class="radio radio-primary"
                            {% if form.invoice_type.value == "manual" %}checked{% endif %}>
                        <span>يدوية</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="invoice_type" value="adjustment" class="radio radio-primary"
                            {% if form.invoice_type.value == "adjustment" %}checked{% endif %}>
                        <span>تعديل</span>
                    </label>
                </div>
            </div>

            <!-- Subscription -->
            <div class="form-control md:col-span-2">
                <label class="label">
                    <span class="label-text">الاشتراك</span>
                </label>
                <select name="subscription" class="bg-dark4 border border-g/20 text-textMain rounded-lg outline-none transition-all px-4 py-2 w-full focus:border-g focus:ring-2 focus:ring-g/10">
                    <option value="">-- اختر اشتراك --</option>
                    {% for s in subscriptions %}
                        <option value="{{ s.id }}"
                            {% if form.subscription.value|stringformat:"s" == s.id|stringformat:"s" %}selected{% endif %}>
                            #{{ s.id }} - {{ s.customer.name }}{% if s.plan %} - {{ s.plan.name }}{% endif %}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Issue Date -->
            <div class="form-control">
                <label class="label">
                    <span class="label-text">تاريخ الإصدار</span>
                </label>
                <input type="date" name="issue_date"
                       value="{{ form.issue_date.value|date:'Y-m-d' }}"
                       class="bg-dark4 border border-g/20 text-textMain rounded-lg outline-none transition-all px-4 py-2 w-full focus:border-g focus:ring-2 focus:ring-g/10" />
            </div>

            <!-- Due Date -->
            <div class="form-control">
                <label class="label">
                    <span class="label-text">تاريخ الاستحقاق</span>
                </label>
                <input type="date" name="due_date"
                       value="{{ form.due_date.value|date:'Y-m-d' }}"
                       class="bg-dark4 border border-g/20 text-textMain rounded-lg outline-none transition-all px-4 py-2 w-full focus:border-g focus:ring-2 focus:ring-g/10"
                       required />
            </div>

            <!-- Amount -->
            <div class="form-control md:col-span-2">
                <label class="label">
                    <span class="label-text">المبلغ</span>
                </label>
                <input type="number" step="0.01" name="amount"
                       value="{{ form.amount.value|default:'' }}"
                       class="bg-dark4 border border-g/20 text-textMain rounded-lg outline-none transition-all px-4 py-2 w-full focus:border-g focus:ring-2 focus:ring-g/10"
                       placeholder="0.00"
                       required />
            </div>

            <!-- Status -->
            <div class="form-control md:col-span-2">
                <label class="label">
                    <span class="label-text">حالة الفاتورة</span>
                </label>
                <select name="status" class="bg-dark4 border border-g/20 text-textMain rounded-lg outline-none transition-all px-4 py-2 w-full focus:border-g focus:ring-2 focus:ring-g/10">
                    <option value="pending" {% if form.status.value == "pending" %}selected{% endif %}>بانتظار الدفع</option>
                    <option value="paid" {% if form.status.value == "paid" %}selected{% endif %}>مدفوعة</option>
                    <option value="overdue" {% if form.status.value == "overdue" %}selected{% endif %}>متأخرة</option>
                    <option value="cancelled" {% if form.status.value == "cancelled" %}selected{% endif %}>ملغاة</option>
                </select>
            </div>

        </div>
    </div>

    <!-- Footer -->
    <div class="px-6 py-4 border-t border-g/10 bg-dark3 flex justify-end gap-3">
        <button type="submit"
            class="px-6 py-2.5 rounded-lg text-sm font-bold bg-g text-dark hover:bg-g2 hover:-translate-y-[1px] active:translate-y-0 transition-all shadow-[0_4px_15px_rgba(0,201,141,0.2)]">
            {% if invoice %}تحديث{% else %}إنشاء{% endif %}
        </button>
    </div>

</form>

</dialog>
