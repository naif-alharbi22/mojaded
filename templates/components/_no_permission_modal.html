<div id="permission-modal-mount" hx-swap-oob="innerHTML:#permission-modal-mount">
    <dialog id="permission-denied-modal" class="modal modal-open" auto-close="false">
        <div class="modal-box max-w-md p-0 overflow-hidden rounded-2xl bg-dark2 border border-red-400/30 shadow-2xl">

            <div class="px-6 py-4 border-b border-red-400/20 flex items-center justify-between bg-dark3">
                <h3 class="text-base font-bold px-4 py-1.5 rounded-lg bg-red-400/10 text-red-400 border border-red-400/20 flex items-center gap-2">
                    <i data-lucide="shield-off" class="w-4 h-4"></i>
                    ليس لديك صلاحية
                </h3>
                <button type="button" onclick="closeModal(this)">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>

            <div class="p-6 space-y-3 bg-dark text-center">
                <div class="mx-auto w-14 h-14 rounded-full bg-red-400/10 border border-red-400/20 flex items-center justify-center">
                    <i data-lucide="lock" class="w-6 h-6 text-red-400"></i>
                </div>
                <p class="text-textMain text-sm">{{ message }}</p>
                {% if permission_label %}
                    <p class="text-muted text-xs">الصلاحية المطلوبة: <span class="text-red-400">{{ permission_label }}</span></p>
                {% endif %}
            </div>

            <div class="px-6 py-4 border-t border-red-400/20 bg-dark3 flex justify-end gap-3">
                <button type="button" onclick="closeModal(this)"
                    class="px-6 py-2.5 rounded-lg text-sm font-bold bg-dark4 text-textMain hover:bg-dark3 transition-all border border-g/10">
                    حسناً
                </button>
            </div>

        </div>
    </dialog>
    <script>
        if (window.lucide) { lucide.createIcons(); }
    </script>
</div>
