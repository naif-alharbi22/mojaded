{% load i18n %} {% load static %}

<dialog id="modal" class="modal modal-open">
  <form
    method="post"
    hx-post="{% if subscription.id %} {% url 'subscriptions:edit_subscription' subscription.id %} {% else %} {% url 'subscriptions:new_subscriptions' %} {% endif %}"
    hx-target="#modal"
    hx-swap="innerHTML"
    class="modal-box max-w-3xl p-0 overflow-hidden rounded-2xl"
  >
    {% csrf_token %}

    <!-- Header -->
    <div
      class="px-6 py-4 border-b border-gray-200 flex items-center justify-between bg-white"
    >
      <h3
        class="text-lg font-bold bg-gradient-to-r from-purple-600 to-indigo-600 bg-clip-text text-transparent"
      >
        {% translate "New Subscription" %}
      </h3>

<button type="button" onclick="closeModal(this)">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>    </div>

    <!-- Body -->
    <div class="p-6 space-y-5 bg-gray-50">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

    <!-- Customer -->
<div class="form-control">
    <label class="label">
        <span class="label-text">العميل</span>
    </label>
    <select name="customer" class="select select-bordered w-full" required>
        <option value="" {% if not form.customer.value %}selected{% endif %}>أختيار العميل</option>
        {% for customer in customers %}
            <option value="{{ customer.id }}" {% if form.customer.value == customer.id %}selected{% endif %}>{{ customer.name }}</option>
        {% endfor %}
    </select>
</div>

<!-- Plan -->
<div class="form-control">
    <label class="label">
        <span class="label-text">الخطة</span>
    </label>
    <select name="plan" class="select select-bordered w-full">
        <option value="" {% if not form.plan.value %}selected{% endif %}>أختيار الخطة</option>
        {% for plan in plans %}
            <option value="{{ plan.id }}" {% if form.plan.value == plan.id %}selected{% endif %}>{{ plan.name }}</option>
        {% endfor %}
    </select>
</div>

    <!-- Start Date -->
    <div class="form-control">
        <label class="label">
            <span class="label-text">تاريخ البداية</span>
        </label>
        <input type="date" name="start_date" value="{{ form.start_date.value|default:today|date:'Y-m-d' }}" class="input input-bordered w-full">
    </div>

    <!-- Type -->
<div class="form-control">
    <label class="label">
        <span class="label-text">نوع الاشتراك</span>
    </label>
    <div class="flex gap-6 mt-2">
        <label class="flex items-center gap-2 cursor-pointer">
            <input type="radio" name="subscription_type" value="monthly" class="radio radio-primary" {% if form.subscription_type.value == "monthly" %}checked{% endif %}>
            <span>شهري</span>
        </label>

        <label class="flex items-center gap-2 cursor-pointer">
            <input type="radio" name="subscription_type" value="yearly" class="radio radio-primary" {% if form.subscription_type.value == "yearly" %}checked{% endif %}>
            <span>سنوي</span>
        </label>
    </div>
</div>

    <!-- Duration -->
    <div class="form-control">
        <label class="label">
            <span class="label-text">المدة</span>
        </label>
        <input type="number" name="duration_months" min="1" 
               class="input input-bordered w-full" value="{{ form.duration_months.value|default:1 }}">
    </div>

    <!-- Amount -->
    <div class="form-control">
        <label class="label">
            <span class="label-text">المبلغ</span>
        </label>
        <input type="number" step="0.01" name="amount" value="{{ form.amount.value|default:0 }}"
               class="input input-bordered w-full text-left">
    </div>

    <!-- Status -->
    <div class="form-control md:col-span-2">
    <label class="label">
        <span class="label-text">الحالة</span>
    </label>

    <select name="status" class="select select-bordered w-full">
        <option value="" {% if not form.status.value %}selected{% endif %}>اختيار الحالة</option>
        {% for value, label in status_choices %}
            <option value="{{ value }}" {% if form.status.value == value %}selected{% endif %}>
                {% if value == "pending" %}بانتظار الدفع{% endif %}
                {% if value == "active" %}نشط{% endif %}
                {% if value == "past_due" %}متأخر{% endif %}
                {% if value == "trial" %}تجريبي{% endif %}
                {% if value == "paused" %}موقوف مؤقتًا{% endif %}
                {% if value == "cancelled" %}ملغي{% endif %}
                {% if value == "expired" %}منتهي{% endif %}
            </option>
        {% endfor %}
    </select>
</div>

    <!-- Note -->
    <div class="form-control md:col-span-2">
        <label class="label">
            <span class="label-text">ملاحظة</span>
        </label>
        <textarea name="note" value="{{ form.note.value }}"
            class="textarea textarea-bordered w-full"></textarea>
    </div>

</div>

    </div>

    <!-- Footer -->
    <div
      class="px-6 py-4 border-t border-gray-200 bg-white flex justify-end gap-3"
    >
    
      <button
        type="submit"
        class="btn bg-gradient-to-r from-purple-600 to-indigo-600 text-white border-none hover:opacity-90"
      >
        {% translate "Create" %}
      </button>
    </div>
  </form>
</dialog>
