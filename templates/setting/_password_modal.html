{% load static %}
<dialog id="modal" class="modal modal-open">
<div class="modal-box max-w-md p-0 overflow-hidden rounded-2xl bg-dark2 border border-g/20 shadow-2xl">
    <div class="px-6 py-4 border-b border-g/10 flex items-center justify-between bg-dark3">
        <h3 class="text-base font-bold px-4 py-1.5 rounded-lg bg-g/10 text-g border border-g/20">تم إنشاء المستخدم</h3>
        <button type="button" onclick="closeModalAndRefresh(this)"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>

    <div class="p-6 space-y-4 bg-dark">
        <p class="text-sm text-textMain">
            تم إنشاء المستخدم <span class="font-bold text-g">{{ created_user.username }}</span>. هذه كلمة المرور المؤقتة:
        </p>

        <div class="flex items-center gap-2 p-3 bg-dark3 rounded-lg border border-g/20">
            <code id="generated-password" class="flex-1 text-sm text-g font-mono select-all">{{ password }}</code>
            <button type="button" onclick="copyPassword()" class="px-3 py-1.5 text-xs bg-g/10 text-g rounded border border-g/20 hover:bg-g/20">نسخ</button>
        </div>

        <div class="text-xs text-red-300 bg-red-500/5 p-3 rounded-lg border border-red-500/20">
            <i data-lucide="alert-triangle" class="w-3 h-3 inline"></i>
            لن تظهر هذه كلمة المرور مرة أخرى. شاركها مع المستخدم الآن.
        </div>
    </div>

    <div class="px-6 py-4 border-t border-g/10 bg-dark3 flex justify-end">
        <button type="button" onclick="closeModalAndRefresh(this)" class="px-6 py-2.5 rounded-lg text-sm font-bold bg-g text-dark hover:bg-g2">تم</button>
    </div>
</div>
<script>
    function copyPassword() {
        const txt = document.getElementById("generated-password").innerText;
        navigator.clipboard.writeText(txt);
    }
    function closeModalAndRefresh(el) {
        closeModal(el);
        window.dispatchEvent(new Event("usersChanged"));
        htmx.trigger(document.body, "usersChanged");
    }
</script>
</dialog>
